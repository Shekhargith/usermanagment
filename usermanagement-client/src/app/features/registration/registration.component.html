
<div class="registration-container">

  <div class="registration-card">

    <div class="brand">
      <div class="brand-icon">UM</div>
      <h2>Create Account</h2>
      <p>Register to get started with UserManagement</p>
    </div>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="Enter full name"
          required>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter email address"
          required>
      </div>

      <div class="form-group">
        <label>Mobile Number</label>
        <input
          type="tel"
          name="mobile"
          [(ngModel)]="mobile"
          placeholder="Enter mobile number"
          pattern="[0-9]{10}"
          maxlength="10"
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm password"
          required>
      </div>

      <!-- User Roles -->
<div class="form-group">

  <label>User Roles</label>

  <div class="role-container">

    <label class="role-option" *ngFor="let role of availableRoles">

      <input
        type="checkbox"
        [checked]="selectedRoles.includes(role)"
        (change)="onRoleChange(role, $event)">

      {{ role }}

    </label>

  </div>

</div>

      <div class="form-options">
        <label class="terms">
          <input
            type="checkbox"
            name="acceptTerms"
            [(ngModel)]="acceptTerms">
          I accept Terms & Conditions
        </label>

        <label class="terms">
          <input
            type="checkbox"
            [checked]="showPassword"
            (change)="showPassword = !showPassword">
          Show Password
        </label>
      </div>

      <button type="submit" class="register-btn">
        Create Account
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>

    <div class="footer">
      © 2026 UserManagement. All rights reserved.
    </div>

  </div>

</div>
